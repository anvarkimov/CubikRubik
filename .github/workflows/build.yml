name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) TAG="dev-${GITHUB_SHA::7}";; esac
          cp app/build/outputs/apk/debug/app-debug.apk "CubikRubik-${TAG}.apk"
          echo "APK=CubikRubik-${TAG}.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: CubikRubik-apk
          path: ${{ env.APK }}
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" --title "CubikRubik $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
