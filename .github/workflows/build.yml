name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: |
          VER="$(cat VERSION)"
          cp app/build/outputs/apk/debug/app-debug.apk "CubikRubik-v${VER}.apk"
          echo "VER=${VER}" >> "$GITHUB_ENV"
          echo "APK=CubikRubik-v${VER}.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: CubikRubik-apk
          path: ${{ env.APK }}
      - name: Publish GitHub Release (once per VERSION)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VER}" >/dev/null 2>&1; then
            echo "Release v${VER} already exists - bump VERSION to publish a new one."
          else
            gh release create "v${VER}" "$APK" --target "$GITHUB_SHA" --title "CubikRubik v${VER}" --notes-file RELEASE_NOTES.md
          fi
